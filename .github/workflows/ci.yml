name: ci

on:
  push:
    branches: [master]
  pull_request:

# CI runs the same script a maintainer runs locally — `node verify.mjs` — so the
# two cannot drift into disagreeing about what "the checks" are. The Playwright
# suite skips itself here: qa-console/node_modules is a local junction into
# submission/demo-web and does not exist on a fresh checkout.
jobs:
  verify:
    name: verify (contract + agent, offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Add wasm target
        run: rustup target add wasm32-wasip2
      - name: Install agent dependencies
        working-directory: agent
        run: npm ci
      - name: Verify
        run: node verify.mjs
