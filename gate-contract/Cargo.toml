[package]
name = "gate-contract"
version = "0.9.0"
edition = "2021"
description = "Hardware-enforced action mandate gate for delegated agents — Terminal 3 z-space tenant contract"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
wit-bindgen = { version = "0.49", default-features = false, features = ["macros", "realloc"] }
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
hex = { version = "0.4", default-features = false, features = ["alloc"] }
# Pure-Rust SHA-256, compiled into the component. The credential binding is
# recomputed inside the enclave, so it must not depend on a host interface.
sha2 = { version = "0.10", default-features = false }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
