<!doctype html>
<meta charset="utf-8">
<title>Gatekeeper — mandate QA console</title>
<style>
  :root {
    --bg:#0b0f14; --panel:#0e141b; --line:#1e2b3a; --ink:#c8d6e5; --dim:#6b7f95;
    --ok:#5ddba4; --bad:#ff7b72; --accent:#79c0ff;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:14px/1.6 ui-sans-serif,system-ui,"Segoe UI",sans-serif; }
  header { padding:22px 26px; border-bottom:1px solid var(--line); }
  h1 { margin:0 0 4px; font-size:17px; letter-spacing:.2px; }
  .sub { color:var(--dim); font-size:13px; }
  main { display:grid; grid-template-columns:minmax(280px,1fr) minmax(320px,1.1fr);
         gap:18px; padding:22px 26px; align-items:start; }
  @media (max-width:820px) { main { grid-template-columns:1fr; } }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:16px 18px; }
  h2 { margin:0 0 12px; font-size:12px; text-transform:uppercase; letter-spacing:.9px; color:var(--dim); }
  button { display:block; width:100%; text-align:left; margin-bottom:8px; padding:10px 12px;
           background:#131c26; color:var(--ink); border:1px solid var(--line);
           border-radius:7px; cursor:pointer; font:inherit; font-size:13px; }
  button:hover { border-color:var(--accent); }
  button b { display:block; font-weight:600; }
  button span { color:var(--dim); font-size:12px; }
  .verdict { font-size:15px; font-weight:700; letter-spacing:.4px; margin-bottom:10px; }
  .approved { color:var(--ok); } .rejected { color:var(--bad); }
  ul { margin:0; padding-left:18px; } li { color:var(--bad); font-size:13px; margin-bottom:4px; }
  pre { margin:12px 0 0; padding:11px 13px; background:#0a1017; border:1px solid var(--line);
        border-radius:7px; color:var(--dim); font-size:12px; overflow-x:auto; white-space:pre-wrap; }
  .idle { color:var(--dim); }
  code { color:var(--accent); }
</style>

<header>
  <h1>Gatekeeper — mandate QA console</h1>
  <div class="sub">
    Scenario: an investor's agent buying into <b>Meridian Private Credit Fund</b> under a
    delegated mandate. Every verdict below comes from <code>gate::decide()</code> —
    the same Rust the TEE contract runs — not a JavaScript reimplementation.
  </div>
</header>

<main>
  <div class="panel">
    <h2>Scenarios</h2>
    <button data-testid="s-happy" data-scenario="happy">
      <b>✅ Buy $1,000 of USDC — in mandate</b>
      <span>within cap, allowed asset + kind, approved payee</span>
    </button>
    <button data-testid="s-over" data-scenario="over">
      <b>❌ Buy $9,000 — over the cap</b>
      <span>exceeds the $5,000 per-action limit</span>
    </button>
    <button data-testid="s-asset" data-scenario="asset">
      <b>❌ Swap into DOGE — asset + kind not allowed</b>
      <span>outside the delegated instrument list</span>
    </button>
    <button data-testid="s-payee" data-scenario="payee">
      <b>❌ Pay an unknown counterparty</b>
      <span>payee not on the mandate's allow-list</span>
    </button>
    <button data-testid="s-expired" data-scenario="expired">
      <b>❌ Expired mandate</b>
      <span>authorization lapsed before the action</span>
    </button>
    <button data-testid="s-empty" data-scenario="empty">
      <b>❌ Unconfigured mandate — deny by default</b>
      <span>empty allow-lists must permit nothing</span>
    </button>
    <button data-testid="s-issuer-ok" data-scenario="issuerOk">
      <b>✅ Credential from the trusted KYC issuer</b>
      <span>issuer is on the mandate's trust list</span>
    </button>
    <button data-testid="s-issuer-bad" data-scenario="issuerBad">
      <b>❌ Self-issued credential</b>
      <span>the agent minted its own accreditation</span>
    </button>
    <button data-testid="s-sublimit" data-scenario="sublimit">
      <b>❌ $1,000 to a payee capped at $100</b>
      <span>under the global cap, over the per-payee sub-limit</span>
    </button>
  </div>

  <div class="panel">
    <h2>Enclave decision</h2>
    <div id="verdict" class="verdict idle" data-testid="verdict">Pick a scenario →</div>
    <ul id="reasons" data-testid="reasons"></ul>
    <pre id="raw" data-testid="raw"></pre>
  </div>
</main>

<script type="module">
  const BASE = {
    max_amount_cents: 500000, allowed_assets: ["USDC", "USD"], allowed_kinds: ["rwa.buy"],
    allowed_counterparties: ["did:t3n:meridian-fund"], expires_at_secs: 0, valid_after_secs: 0,
  };
  const NOW = 1786000000;
  const PAYEE = "did:t3n:meridian-fund";
  const KYC = "did:key:kyc-provider";

  const SCENARIOS = {
    happy:   { action: { kind:"rwa.buy", asset:"USDC", amount_cents:100000, counterparty:PAYEE } },
    over:    { action: { kind:"rwa.buy", asset:"USDC", amount_cents:900000, counterparty:PAYEE } },
    asset:   { action: { kind:"swap",    asset:"DOGE", amount_cents:100,    counterparty:PAYEE } },
    payee:   { action: { kind:"rwa.buy", asset:"USDC", amount_cents:100000, counterparty:"did:t3n:unknown-payee" } },
    expired: { action: { kind:"rwa.buy", asset:"USDC", amount_cents:100000, counterparty:PAYEE },
               mandate: { ...BASE, expires_at_secs: NOW - 3600 } },
    empty:   { action: { kind:"rwa.buy", asset:"USDC", amount_cents:1, counterparty:PAYEE },
               mandate: { max_amount_cents: 999999999, allowed_assets: [], allowed_kinds: [],
                          allowed_counterparties: [], expires_at_secs: 0, valid_after_secs: 0 } },
    issuerOk:  { action: { kind:"rwa.buy", asset:"USDC", amount_cents:100000, counterparty:PAYEE, issuer:KYC },
                 mandate: { ...BASE, allowed_issuers: [KYC] } },
    issuerBad: { action: { kind:"rwa.buy", asset:"USDC", amount_cents:100000, counterparty:PAYEE,
                           issuer:"did:key:the-agent-itself" },
                 mandate: { ...BASE, allowed_issuers: [KYC] } },
    sublimit:  { action: { kind:"rwa.buy", asset:"USDC", amount_cents:100000, counterparty:PAYEE },
                 mandate: { ...BASE, counterparty_limits: { [PAYEE]: 10000 } } },
  };

  const $ = (id) => document.getElementById(id);

  async function run(name) {
    const { action, mandate = BASE } = SCENARIOS[name];
    $("verdict").textContent = "…"; $("verdict").className = "verdict idle";
    $("reasons").innerHTML = ""; $("raw").textContent = "";

    const res = await fetch("/api/decide", {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ action, mandate, now_secs: NOW }),
    });
    const out = await res.json();

    const approved = out.decision === "approved";
    $("verdict").textContent = approved ? "APPROVED" : "REJECTED";
    $("verdict").className = `verdict ${approved ? "approved" : "rejected"}`;
    $("reasons").innerHTML = (out.reasons ?? []).map((r) => `<li>${r}</li>`).join("");
    $("raw").textContent = JSON.stringify({ action, decision: out.decision, reasons: out.reasons }, null, 2);
    document.body.dataset.decision = out.decision ?? "error";
  }

  for (const b of document.querySelectorAll("button[data-scenario]")) {
    b.addEventListener("click", () => run(b.dataset.scenario));
  }
</script>
